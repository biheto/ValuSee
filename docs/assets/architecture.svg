<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="DevAgent Studio architecture diagram">
  <rect width="1280" height="720" fill="#f4f6f8"/>
  <text x="640" y="56" text-anchor="middle" font-family="Segoe UI, Arial" font-size="28" font-weight="700" fill="#253349">DevAgent Studio Architecture</text>
  <text x="640" y="86" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#657386">FastAPI + LangGraph + React multi-agent governance workbench</text>
  <g font-family="Segoe UI, Arial">
    <rect x="70" y="132" width="250" height="420" rx="12" fill="#ffffff" stroke="#d9e1ea"/>
    <text x="195" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#253349">React Workbench</text>
    <g font-size="13" fill="#405064">
      <rect x="96" y="198" width="198" height="42" rx="7" fill="#eef8fc" stroke="#9fc8dc"/>
      <text x="195" y="224" text-anchor="middle">Run / Workflow</text>
      <rect x="96" y="260" width="198" height="42" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
      <text x="195" y="286" text-anchor="middle">Reports / Chat</text>
      <rect x="96" y="322" width="198" height="42" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
      <text x="195" y="348" text-anchor="middle">LLM / MCP Console</text>
      <rect x="96" y="384" width="198" height="42" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
      <text x="195" y="410" text-anchor="middle">Benchmark Dashboard</text>
    </g>
    <rect x="395" y="132" width="250" height="420" rx="12" fill="#ffffff" stroke="#d9e1ea"/>
    <text x="520" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#253349">FastAPI Layer</text>
    <g font-size="13" fill="#405064">
      <rect x="421" y="198" width="198" height="42" rx="7" fill="#eef9f3" stroke="#bfe2d1"/>
      <text x="520" y="224" text-anchor="middle">Task APIs</text>
      <rect x="421" y="260" width="198" height="42" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
      <text x="520" y="286" text-anchor="middle">Workflow APIs</text>
      <rect x="421" y="322" width="198" height="42" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
      <text x="520" y="348" text-anchor="middle">RAG / MCP / LLM APIs</text>
      <rect x="421" y="384" width="198" height="42" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
      <text x="520" y="410" text-anchor="middle">Benchmark APIs</text>
    </g>
    <rect x="720" y="132" width="250" height="420" rx="12" fill="#ffffff" stroke="#d9e1ea"/>
    <text x="845" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#253349">LangGraph Runtime</text>
    <g font-size="13" fill="#405064">
      <rect x="746" y="198" width="198" height="42" rx="7" fill="#fff8e8" stroke="#e5ca91"/>
      <text x="845" y="224" text-anchor="middle">Planner</text>
      <rect x="746" y="260" width="198" height="42" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
      <text x="845" y="286" text-anchor="middle">Project / Code Agents</text>
      <rect x="746" y="322" width="198" height="42" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
      <text x="845" y="348" text-anchor="middle">RAG / Supervisor</text>
      <rect x="746" y="384" width="198" height="42" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
      <text x="845" y="410" text-anchor="middle">Reporter / Human Review</text>
    </g>
    <rect x="1045" y="132" width="165" height="420" rx="12" fill="#ffffff" stroke="#d9e1ea"/>
    <text x="1128" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#253349">Providers</text>
    <g font-size="13" fill="#405064">
      <rect x="1068" y="198" width="119" height="42" rx="7" fill="#eef8fc" stroke="#9fc8dc"/>
      <text x="1128" y="224" text-anchor="middle">LLM</text>
      <rect x="1068" y="260" width="119" height="42" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
      <text x="1128" y="286" text-anchor="middle">MCP</text>
      <rect x="1068" y="322" width="119" height="42" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
      <text x="1128" y="348" text-anchor="middle">RAG Store</text>
      <rect x="1068" y="384" width="119" height="42" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
      <text x="1128" y="410" text-anchor="middle">SQLite</text>
    </g>
  </g>
  <g stroke="#8aa6b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M320 342 L395 342"/>
    <path d="M645 342 L720 342"/>
    <path d="M970 342 L1045 342"/>
  </g>
  <g font-family="Segoe UI, Arial" font-size="12" fill="#657386">
    <text x="358" y="328" text-anchor="middle">HTTP/SSE</text>
    <text x="682" y="328" text-anchor="middle">invoke</text>
    <text x="1008" y="328" text-anchor="middle">tools</text>
  </g>
  <rect x="190" y="600" width="900" height="64" rx="10" fill="#ffffff" stroke="#d9e1ea"/>
  <text x="640" y="626" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#253349">Persistence and Governance</text>
  <text x="640" y="650" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#657386">task events, artifacts, LLM traces, prompt versions, MCP approvals, call logs, RAG documents, benchmark runs</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8aa6b8"/>
    </marker>
  </defs>
</svg>
