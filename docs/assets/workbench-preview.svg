<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="DevAgent Studio workbench preview">
  <rect width="1280" height="720" fill="#eef2f5"/>
  <rect x="0" y="0" width="76" height="720" fill="#ffffff"/>
  <rect x="18" y="20" width="40" height="40" rx="12" fill="#235d86"/>
  <text x="38" y="46" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="700" fill="#ffffff">D</text>
  <g font-family="Segoe UI, Arial" font-size="11" fill="#657386">
    <rect x="10" y="92" width="56" height="54" rx="12" fill="#e8f2f7"/>
    <text x="38" y="126" text-anchor="middle" fill="#1f5c84">Run</text>
    <text x="38" y="184" text-anchor="middle">Flow</text>
    <text x="38" y="242" text-anchor="middle">Report</text>
    <text x="38" y="300" text-anchor="middle">LLM</text>
    <text x="38" y="358" text-anchor="middle">MCP</text>
    <text x="38" y="416" text-anchor="middle">Bench</text>
  </g>
  <rect x="76" y="0" width="1204" height="64" fill="#ffffff"/>
  <text x="104" y="39" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#253349">DevAgent Studio</text>
  <text x="1050" y="39" font-family="Segoe UI, Arial" font-size="13" fill="#657386">multi-agent governance workbench</text>
  <g transform="translate(98 88)">
    <rect width="300" height="560" rx="8" fill="#ffffff" stroke="#dde3ea"/>
    <rect width="300" height="44" rx="8" fill="#ffffff"/>
    <line x1="0" y1="44" x2="300" y2="44" stroke="#e1e6ec"/>
    <text x="18" y="28" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#253349">Task Input</text>
    <rect x="18" y="72" width="264" height="120" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
    <text x="32" y="104" font-family="Segoe UI, Arial" font-size="13" fill="#405064">Analyze project structure,</text>
    <text x="32" y="128" font-family="Segoe UI, Arial" font-size="13" fill="#405064">risks and knowledge assets.</text>
    <rect x="18" y="220" width="264" height="38" rx="6" fill="#ffffff" stroke="#dce5ed"/>
    <text x="32" y="244" font-family="Segoe UI, Arial" font-size="12" fill="#657386">Project path</text>
    <rect x="18" y="286" width="126" height="34" rx="7" fill="#e8f4fa" stroke="#9fc8dc"/>
    <text x="81" y="308" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#245e88">Planner</text>
    <rect x="156" y="286" width="126" height="34" rx="7" fill="#f7fafc" stroke="#d8e0e8"/>
    <text x="219" y="308" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#405064">Collab</text>
    <rect x="18" y="358" width="264" height="42" rx="7" fill="#235d86"/>
    <text x="150" y="384" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#ffffff">Run Task</text>
  </g>
  <g transform="translate(422 88)">
    <rect width="460" height="560" rx="8" fill="#ffffff" stroke="#dde3ea"/>
    <line x1="0" y1="44" x2="460" y2="44" stroke="#e1e6ec"/>
    <text x="18" y="28" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#253349">Execution Timeline + Graph</text>
    <g transform="translate(38 86)">
      <rect x="0" y="0" width="145" height="56" rx="7" fill="#eef8fc" stroke="#9fc8dc"/>
      <text x="72" y="34" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#253349">Planner</text>
      <rect x="220" y="0" width="145" height="56" rx="7" fill="#ffffff" stroke="#b9c8d5"/>
      <text x="292" y="34" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#253349">Project Agent</text>
      <rect x="110" y="110" width="145" height="56" rx="7" fill="#fff8e8" stroke="#e5ca91"/>
      <text x="182" y="144" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#253349">Human Review</text>
      <rect x="220" y="220" width="145" height="56" rx="7" fill="#eef9f3" stroke="#bfe2d1"/>
      <text x="292" y="254" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#253349">Reporter</text>
      <path d="M145 28 L220 28" stroke="#8aa6b8" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M292 56 C292 92 182 76 182 110" stroke="#8aa6b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
      <path d="M182 166 C182 206 292 184 292 220" stroke="#8aa6b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(22 410)" font-family="Segoe UI, Arial">
      <rect width="416" height="104" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
      <circle cx="24" cy="28" r="5" fill="#206b50"/>
      <text x="42" y="33" font-size="12" fill="#405064">Planner generated workflow steps</text>
      <circle cx="24" cy="56" r="5" fill="#245e88"/>
      <text x="42" y="61" font-size="12" fill="#405064">Project Agent completed structure analysis</text>
      <circle cx="24" cy="84" r="5" fill="#8a5a12"/>
      <text x="42" y="89" font-size="12" fill="#405064">Human review checkpoint created</text>
    </g>
  </g>
  <g transform="translate(906 88)">
    <rect width="330" height="560" rx="8" fill="#ffffff" stroke="#dde3ea"/>
    <line x1="0" y1="44" x2="330" y2="44" stroke="#e1e6ec"/>
    <text x="18" y="28" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#253349">Agent Output</text>
    <g font-family="Segoe UI, Arial" font-size="12">
      <rect x="18" y="72" width="294" height="92" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
      <text x="34" y="100" font-weight="700" fill="#253349">Current State</text>
      <text x="34" y="126" fill="#657386">risk_level: medium</text>
      <text x="34" y="148" fill="#657386">review_required: true</text>
      <rect x="18" y="190" width="294" height="130" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
      <text x="34" y="218" font-weight="700" fill="#253349">Tool Calls</text>
      <text x="34" y="244" fill="#657386">filesystem.list completed</text>
      <text x="34" y="268" fill="#657386">rag.query completed</text>
      <rect x="18" y="346" width="294" height="154" rx="7" fill="#fbfcfd" stroke="#dce5ed"/>
      <text x="34" y="374" font-weight="700" fill="#253349">Final Report</text>
      <text x="34" y="402" fill="#657386">Project structure summary</text>
      <text x="34" y="426" fill="#657386">Governance suggestions</text>
      <text x="34" y="450" fill="#657386">Next actions</text>
    </g>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8aa6b8"/>
    </marker>
  </defs>
</svg>
