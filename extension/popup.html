<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><link rel="stylesheet" href="popup.css" /><title>ValuSee</title></head>
  <body>
    <header><img src="icons/icon128.png" alt="" /><div><strong>ValuSee 见值</strong><span id="connection">正在检查连接</span></div><button id="settings" title="连接设置">设置</button></header>
    <main>
      <section id="settingsPanel" hidden>
        <label>ValuSee 地址<input id="appUrl" type="url" placeholder="https://valusee.com" /></label>
        <label>登录邮箱<input id="email" type="email" autocomplete="username" /></label>
        <label>登录密码<input id="password" type="password" autocomplete="current-password" /></label>
        <label>动态验证码（管理员开启 MFA 后必填）<input id="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="32" /></label>
        <button id="connect">连接账户</button><button id="disconnect" class="secondary">断开连接</button>
      </section>
      <section id="editor" hidden>
        <label>商品标题<input id="title" maxlength="200" /></label>
        <div class="pair"><label>当前价格<input id="price" type="number" min="0" step="0.01" /></label><label>SKU<input id="sku" maxlength="100" /></label></div>
        <label>已选规格<input id="variant" maxlength="240" /></label>
        <div class="pair"><label>优惠券<input id="coupon" type="number" min="0" step="0.01" /></label><label>满减/平台优惠<input id="discount" type="number" min="0" step="0.01" /></label></div>
        <div class="pair"><label>会员优惠<input id="memberDiscount" type="number" min="0" step="0.01" /></label><label>运费<input id="shipping" type="number" min="0" step="0.01" /></label></div>
        <div class="pair"><label>地区<input id="region" maxlength="80" /></label><label>会员条件<input id="membership" maxlength="100" /></label></div>
        <p id="source"></p>
        <button id="capture">确认并发送</button>
      </section>
      <div id="preview">正在读取当前商品页...</div>
      <button id="retry" class="secondary">重新识别当前页</button>
      <button id="open" class="secondary">打开 ValuSee</button><p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
