[project]
name = "valuesee"
version = "0.1.0"
description = "AI shopping decision and savings agent built with FastAPI and LangGraph."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "pika>=1.3.2",
    "boto3>=1.35.0",
    "cryptography>=44.0.0",
    "Pillow>=10.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0"
]
llm = [
    "langchain-openai>=0.2.0"
]
vector = [
    "psycopg[binary]>=3.2.0",
    "langchain-openai>=0.2.0"
]
ocr = [
    "Pillow>=10.4.0",
    "pytesseract>=0.3.13"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
